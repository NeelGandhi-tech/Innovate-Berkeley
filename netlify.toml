[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

# Handle client-side routing - specific routes first
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/challenge"
  to = "/challenge.html"
  status = 200

# Catch-all redirect for SPA routing (but not for static assets)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false