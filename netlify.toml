[build]
  command = "npm run build"
  publish = "public"
  functions = ""

[build.environment]
  NODE_VERSION = "18"

# Explicitly serve static assets first
[[redirects]]
  from = "/css/*"
  to = "/css/:splat"
  status = 200

[[redirects]]
  from = "/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

# Handle client-side routing - specific routes only
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/challenge"
  to = "/challenge.html"
  status = 200

# Catch-all redirect for SPA routing (but not for static assets)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false